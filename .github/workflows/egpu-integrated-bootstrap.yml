name: egpu-integrated-bootstrap

on:
  push:
    branches:
      - carrot-wip-integrated-v0

permissions:
  contents: write

jobs:
  patch-modeld:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: carrot-wip-integrated-v0
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply strict integration patch
        run: python tools/apply_egpu_integrated_modeld_patch.py

      - name: Verify diff
        run: |
          git diff --check
          git status --short

      - name: Commit generated modeld patch
        shell: bash
        run: |
          if git diff --quiet -- openpilot/selfdrive/modeld/modeld.py; then
            echo "No generated modeld change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openpilot/selfdrive/modeld/modeld.py
          git commit -m "egpu: connect integrated observer telemetry and parked shadow tap"
          git push origin HEAD:carrot-wip-integrated-v0
