name: egpu-integrated-ci

on:
  push:
    branches:
      - carrot-wip-integrated-v0
      - carrot-wip-integrated-v6
      - dev-integrated-transition-safety
      - dev-integrated-s1-commissioning
  pull_request:
    branches:
      - carrot-wip
      - carrot-wip-integrated-v0
      - carrot-wip-integrated-v6

permissions:
  contents: read

jobs:
  integrated-egpu-safety:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile integrated Python sources
        run: |
          python -m py_compile \
            openpilot/selfdrive/modeld/modeld.py \
            openpilot/selfdrive/modeld/egpu_integration_observer.py \
            openpilot/selfdrive/modeld/egpu_hardware_telemetry.py \
            openpilot/selfdrive/modeld/egpu_integrated_shadow_tap.py \
            openpilot/selfdrive/modeld/egpu_integrated_model_slots.py \
            openpilot/selfdrive/modeld/egpu_integrated_guardian.py \
            tools/egpu_integrated_s4b_shadow_probe.py \
            tools/egpu_integrated_install_preflight.py \
            tools/egpu_integrated_live_provenance.py \
            tools/egpu_integrated_transition_plan.py \
            tools/egpu_integrated_postboot_verify.py \
            tools/egpu_integrated_s1_plan.py \
            tools/egpu_integrated_s1_qualification.py \
            tools/egpu_integrated_s1_recorder.py \
            tools/egpu_integrated_source_compat.py \
            tools/apply_egpu_integrated_modeld_patch.py

      - name: Verify modeld patch restores reviewed Carrot source
        run: python tools/apply_egpu_integrated_modeld_patch.py

      - name: Run hardware-free integrated runtime tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m unittest -v \
            openpilot.selfdrive.modeld.tests.test_egpu_integrated_runtime \
            openpilot.selfdrive.modeld.tests.test_egpu_integrated_source_compat \
            openpilot.selfdrive.modeld.tests.test_egpu_integrated_v6_migration \
            openpilot.selfdrive.modeld.tests.test_egpu_integrated_transition_safety \
            openpilot.selfdrive.modeld.tests.test_egpu_integrated_s1_commissioning

      - name: Verify current upstream Carrot integration boundary
        run: python tools/egpu_integrated_source_compat.py --output /tmp/egpu-upstream-compat.json

      - name: Verify transition and S1 plan tools are non-executing
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
            Path('tools/egpu_integrated_live_provenance.py'),
            Path('tools/egpu_integrated_transition_plan.py'),
            Path('tools/egpu_integrated_postboot_verify.py'),
            Path('tools/egpu_integrated_install_preflight.py'),
            Path('tools/egpu_integrated_s1_plan.py'),
            Path('tools/egpu_integrated_s1_qualification.py'),
          ]
          forbidden = (
            'git switch', 'git checkout', 'git reset --hard', 'systemctl restart',
            'sudo reboot', 'reboot -f', 'Params().put', 'Params().put_bool',
            "pm.send('modelV2'", 'PubMaster(',
          )
          for path in files:
            source = path.read_text(encoding='utf-8')
            for token in forbidden:
              if token in source:
                raise SystemExit(f'forbidden mutating/control token in {path}: {token}')
          print('transitionAndS1PlanVerification=PASS')
          PY

      - name: Verify S1 recorder cannot mutate markers or publish controls
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          path = Path('tools/egpu_integrated_s1_recorder.py')
          tree = ast.parse(path.read_text(encoding='utf-8'))
          marker_names = {'OBSERVER_MARKER', 'TELEMETRY_MARKER', 'SHADOW_MARKER'}
          forbidden_marker_methods = {'touch', 'unlink', 'write_text', 'write_bytes', 'rename', 'replace'}
          for node in ast.walk(tree):
            if isinstance(node, ast.Call) and isinstance(node.func, ast.Attribute):
              if isinstance(node.func.value, ast.Name) and node.func.value.id in marker_names and node.func.attr in forbidden_marker_methods:
                raise SystemExit(f'forbidden marker mutation: {node.func.value.id}.{node.func.attr}')
            if isinstance(node, ast.ImportFrom):
              for alias in node.names:
                if alias.name == 'PubMaster':
                  raise SystemExit('S1 recorder must not import PubMaster')
          source = path.read_text(encoding='utf-8')
          for token in ('Params(', '.put_bool(', '.put(', 'PubMaster('):
            if token in source:
              raise SystemExit(f'forbidden S1 recorder token: {token}')
          print('s1RecorderReadOnlyVerification=PASS')
          PY

      - name: Verify S1 policy schema has no hidden defaults
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          schema = json.loads(Path('config/egpu_integrated_s1_policy.schema.json').read_text())
          required = set(schema['required'])
          props = schema['properties']
          if set(props) != required:
            raise SystemExit('S1 policy properties and required fields differ')
          for name, value in props.items():
            if 'default' in value:
              raise SystemExit(f'hidden default in S1 policy: {name}')
          print('s1PolicyNoDefaults=PASS')
          PY

      - name: Verify parked probe has no control publication or manager registration
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('tools/egpu_integrated_s4b_shadow_probe.py')
          tree = ast.parse(path.read_text(encoding='utf-8'))
          forbidden_imports = {'PubMaster'}
          for node in ast.walk(tree):
            if isinstance(node, ast.ImportFrom):
              for alias in node.names:
                if alias.name in forbidden_imports:
                  raise SystemExit(f'forbidden import: {alias.name}')
            if isinstance(node, ast.Call) and isinstance(node.func, ast.Attribute) and node.func.attr == 'send':
              if node.args and isinstance(node.args[0], ast.Constant) and node.args[0].value in {'modelV2', 'carControl'}:
                raise SystemExit(f'forbidden publish call: {node.args[0].value}')
          source = path.read_text(encoding='utf-8')
          for required in ('controlEligible\", False', 'qualityComparisonEligible\", False', 'MAX_S4B_HZ = 5.0'):
            if required not in source:
              raise SystemExit(f'missing safety invariant: {required}')
          print('staticSafetyVerification=PASS')
          PY

      - name: Diff hygiene
        run: git diff --check
