name: egpu-integrated-ci

on:
  push:
    branches:
      - carrot-wip-integrated-v0
      - carrot-wip-integrated-v6
      - dev-integrated-transition-safety
      - dev-integrated-s1-commissioning
      - dev-integrated-s2-telemetry
      - dev-integrated-commissioning-ledger
      - dev-integrated-s4b-entry-gate
      - dev-integrated-carrot-e893-rebase
      - dev-integrated-guardian-replay-faults-e893
      - dev-integrated-model-contracts
      - dev-integrated-provenance-fault-review-20260908
  pull_request:
    branches:
      - carrot-wip
      - carrot-wip-integrated-v0
      - carrot-wip-integrated-v6

permissions:
  contents: read

jobs:
  integrated-egpu-safety:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked NumPy for Carrot cut-out regression
        run: python -m pip install --disable-pip-version-check --no-deps numpy==2.4.3

      - name: Compile integrated Python sources
        run: |
          python -m py_compile \
            openpilot/selfdrive/modeld/modeld.py \
            openpilot/selfdrive/modeld/egpu_integration_observer.py \
            openpilot/selfdrive/modeld/egpu_hardware_telemetry.py \
            openpilot/selfdrive/modeld/egpu_integrated_shadow_tap.py \
            openpilot/selfdrive/modeld/egpu_integrated_model_slots.py \
            openpilot/selfdrive/modeld/egpu_integrated_model_contract.py \
            openpilot/selfdrive/modeld/egpu_integrated_guardian.py \
            openpilot/selfdrive/modeld/egpu_integrated_guardian_temporal.py \
            openpilot/selfdrive/modeld/egpu_integrated_fault_state.py \
            openpilot/selfdrive/controls/lib/longitudinal_cutout.py \
            tools/egpu_integrated_model_contract.py \
            tools/egpu_integrated_s4b_shadow_probe.py \
            tools/egpu_integrated_install_preflight.py \
            tools/egpu_integrated_live_provenance.py \
            tools/egpu_integrated_transition_plan.py \
            tools/egpu_integrated_postboot_verify.py \
            tools/egpu_integrated_s1_plan.py \
            tools/egpu_integrated_s1_qualification.py \
            tools/egpu_integrated_s1_recorder.py \
            tools/egpu_integrated_s1_build_evidence.py \
            tools/egpu_integrated_s2a_plan.py \
            tools/egpu_integrated_s2a_recorder.py \
            tools/egpu_integrated_s2a_build_evidence.py \
            tools/egpu_integrated_s2a_qualification.py \
            tools/egpu_integrated_s2b_plan.py \
            tools/egpu_integrated_qualification_binding.py \
            tools/egpu_integrated_commissioning_ledger.py \
            tools/egpu_integrated_s4b_readiness.py \
            tools/egpu_integrated_fault_injection.py \
            tools/egpu_integrated_guardian_replay.py \
            tools/egpu_integrated_review_queue.py \
            tools/egpu_integrated_source_compat.py \
            tools/carrot_route_vault/build_bundle.py \
            openpilot/selfdrive/carrot/radar/tools/radar_web_export.py \
            tools/apply_egpu_integrated_modeld_patch.py

      - name: Verify modeld patch restores reviewed Carrot source
        run: python tools/apply_egpu_integrated_modeld_patch.py

      - name: Run hardware-free integrated runtime tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m unittest -v \
            openpilot.selfdrive.modeld.tests.test_egpu_integrated_runtime \
            openpilot.selfdrive.modeld.tests.test_egpu_integrated_source_compat \
            openpilot.selfdrive.modeld.tests.test_egpu_integrated_radar_provenance \
            openpilot.selfdrive.modeld.tests.test_egpu_integrated_v6_migration \
            openpilot.selfdrive.modeld.tests.test_egpu_integrated_carrot_cutout \
            openpilot.selfdrive.modeld.tests.test_egpu_integrated_transition_safety \
            openpilot.selfdrive.modeld.tests.test_egpu_integrated_s1_commissioning \
            openpilot.selfdrive.modeld.tests.test_egpu_integrated_s1_evidence \
            openpilot.selfdrive.modeld.tests.test_egpu_integrated_s2_telemetry \
            openpilot.selfdrive.modeld.tests.test_egpu_integrated_s2_evidence \
            openpilot.selfdrive.modeld.tests.test_egpu_integrated_qualification_binding \
            openpilot.selfdrive.modeld.tests.test_egpu_integrated_commissioning_ledger \
            openpilot.selfdrive.modeld.tests.test_egpu_integrated_s4b_entry_gate \
            openpilot.selfdrive.modeld.tests.test_egpu_integrated_guardian_replay_faults \
            openpilot.selfdrive.modeld.tests.test_egpu_integrated_offline_integrity \
            openpilot.selfdrive.modeld.tests.test_egpu_integrated_review_queue \
            openpilot.selfdrive.modeld.tests.test_egpu_integrated_model_contract

      - name: Run synthetic fault-injection suite
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python tools/egpu_integrated_fault_injection.py --all

      - name: Verify current upstream Carrot integration boundary
        run: python tools/egpu_integrated_source_compat.py --output /tmp/egpu-upstream-compat.json

      - name: Verify model contract layer cannot activate or load models
        run: |
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          files = [
            Path('openpilot/selfdrive/modeld/egpu_integrated_model_contract.py'),
            Path('tools/egpu_integrated_model_contract.py'),
          ]
          forbidden_names = {
            'ensure_big_model', 'write_state', 'ModelState', 'Params', 'PubMaster',
            'VisionIpcClient', 'Device',
          }
          forbidden_tokens = (
            'UsbGpuActive', 'ChestnutActive', 'ChestnutModelError',
            '.put_bool(', '.put(', 'managerState', "pm.send('modelV2'", "pm.send('carControl'",
            'driving_tinygrad.pkl', 'big_driving_',
          )
          for path in files:
            source = path.read_text(encoding='utf-8')
            tree = ast.parse(source)
            for node in ast.walk(tree):
              if isinstance(node, (ast.Import, ast.ImportFrom)):
                aliases = node.names
                for alias in aliases:
                  if alias.name in forbidden_names:
                    raise SystemExit(f'forbidden model-runtime import in {path}: {alias.name}')
              if isinstance(node, ast.Name) and node.id in forbidden_names:
                raise SystemExit(f'forbidden model-runtime symbol in {path}: {node.id}')
            for token in forbidden_tokens:
              if token in source:
                raise SystemExit(f'forbidden model activation/runtime token in {path}: {token}')

          schema = json.loads(Path('config/egpu_integrated_model_contract.schema.json').read_text())
          required = set(schema['required'])
          props = set(schema['properties'])
          if required != props:
            raise SystemExit('model contract schema top-level required/properties mismatch')
          if schema.get('additionalProperties') is not False:
            raise SystemExit('model contract schema must reject unknown top-level fields')
          policy = schema['properties']['policy']['properties']
          expected_consts = {
            'oneBigOneSmallBaseline': True,
            'runtimeHotSwap': False,
            'crossGenerationMix': False,
            'fallbackSlot': 'qcom',
            'controlAuthorization': False,
            'publicRoadAuthorization': False,
          }
          for name, expected in expected_consts.items():
            if policy.get(name, {}).get('const') != expected:
              raise SystemExit(f'model contract schema policy drift: {name}')
          print('modelContractRuntimeIsolation=PASS')
          PY

      - name: Verify plan, qualification, binding, and ledger tools are non-executing
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
            Path('tools/egpu_integrated_live_provenance.py'),
            Path('tools/egpu_integrated_transition_plan.py'),
            Path('tools/egpu_integrated_postboot_verify.py'),
            Path('tools/egpu_integrated_install_preflight.py'),
            Path('tools/egpu_integrated_s1_plan.py'),
            Path('tools/egpu_integrated_s1_qualification.py'),
            Path('tools/egpu_integrated_s1_build_evidence.py'),
            Path('tools/egpu_integrated_s2a_plan.py'),
            Path('tools/egpu_integrated_s2a_qualification.py'),
            Path('tools/egpu_integrated_s2a_build_evidence.py'),
            Path('tools/egpu_integrated_s2b_plan.py'),
            Path('tools/egpu_integrated_qualification_binding.py'),
            Path('tools/egpu_integrated_commissioning_ledger.py'),
            Path('tools/egpu_integrated_s4b_readiness.py'),
          ]
          forbidden = (
            'git switch', 'git checkout', 'git reset --hard', 'systemctl restart',
            'sudo reboot', 'reboot -f', 'Params().put', 'Params().put_bool',
            "pm.send('modelV2'", 'PubMaster(',
          )
          for path in files:
            source = path.read_text(encoding='utf-8')
            for token in forbidden:
              if token in source:
                raise SystemExit(f'forbidden mutating/control token in {path}: {token}')
          print('planQualificationBindingLedgerVerification=PASS')
          PY

      - name: Verify offline Guardian replay and fault tools stay isolated
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          files = [
            Path('openpilot/selfdrive/modeld/egpu_integrated_fault_state.py'),
            Path('openpilot/selfdrive/modeld/egpu_integrated_guardian_temporal.py'),
            Path('tools/egpu_integrated_fault_injection.py'),
            Path('tools/egpu_integrated_guardian_replay.py'),
            Path('tools/egpu_integrated_review_queue.py'),
          ]
          forbidden_modules = (
            'openpilot.cereal.messaging', 'openpilot.common.params', 'msgq.visionipc', 'tinygrad',
          )
          forbidden_names = {'PubMaster', 'VisionIpcClient'}
          for path in files:
            source = path.read_text(encoding='utf-8')
            tree = ast.parse(source)
            for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                for alias in node.names:
                  if alias.name.startswith(forbidden_modules):
                    raise SystemExit(f'forbidden runtime import in {path}: {alias.name}')
              if isinstance(node, ast.ImportFrom):
                module = node.module or ''
                if module.startswith(forbidden_modules):
                  raise SystemExit(f'forbidden runtime import in {path}: {module}')
                for alias in node.names:
                  if alias.name in forbidden_names:
                    raise SystemExit(f'forbidden runtime symbol in {path}: {alias.name}')
            for token in ('Params(', '.put_bool(', "pm.send('modelV2'", "pm.send('carControl'", 'Device["AMD"]'):
              if token in source:
                raise SystemExit(f'forbidden runtime/control token in {path}: {token}')
          print('offlineGuardianReplayFaultIsolation=PASS')
          PY

      - name: Verify S1 and S2A recorders cannot mutate markers or publish controls
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          marker_names = {'OBSERVER_MARKER', 'TELEMETRY_MARKER', 'SHADOW_MARKER'}
          forbidden_marker_methods = {'touch', 'unlink', 'write_text', 'write_bytes', 'rename', 'replace'}
          for path in [Path('tools/egpu_integrated_s1_recorder.py'), Path('tools/egpu_integrated_s2a_recorder.py')]:
            tree = ast.parse(path.read_text(encoding='utf-8'))
            for node in ast.walk(tree):
              if isinstance(node, ast.Call) and isinstance(node.func, ast.Attribute):
                if isinstance(node.func.value, ast.Name) and node.func.value.id in marker_names and node.func.attr in forbidden_marker_methods:
                  raise SystemExit(f'forbidden marker mutation in {path}: {node.func.value.id}.{node.func.attr}')
              if isinstance(node, ast.ImportFrom):
                for alias in node.names:
                  if alias.name == 'PubMaster':
                    raise SystemExit(f'{path} must not import PubMaster')
            source = path.read_text(encoding='utf-8')
            for token in ('Params(', '.put_bool(', '.put(', 'PubMaster('):
              if token in source:
                raise SystemExit(f'forbidden recorder token in {path}: {token}')
          print('recorderReadOnlyVerification=PASS')
          PY

      - name: Verify S2B execution tooling remains deferred
        run: |
          test ! -e tools/egpu_integrated_s2b_recorder.py
          test ! -e tools/egpu_integrated_s2b_qualification.py
          test ! -e tools/egpu_integrated_s4c_runner.py
          echo 's2bExecutionDeferred=PASS'

      - name: Verify commissioning policy schemas have no hidden defaults
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [
            Path('config/egpu_integrated_s1_policy.schema.json'),
            Path('config/egpu_integrated_s2a_policy.schema.json'),
          ]:
            schema = json.loads(path.read_text())
            required = set(schema['required'])
            props = schema['properties']
            if set(props) != required:
              raise SystemExit(f'policy properties and required fields differ: {path}')
            for name, value in props.items():
              if 'default' in value:
                raise SystemExit(f'hidden default in {path}: {name}')
          print('commissioningPolicyNoDefaults=PASS')
          PY

      - name: Verify evidence schemas expose complete top-level contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [
            Path('config/egpu_integrated_s1_evidence.schema.json'),
            Path('config/egpu_integrated_s2a_evidence.schema.json'),
          ]:
            schema = json.loads(path.read_text())
            required = set(schema['required'])
            props = set(schema['properties'])
            if required != props:
              raise SystemExit(f'evidence schema top-level required/properties differ: {path}')
            if schema.get('additionalProperties') is not False:
              raise SystemExit(f'evidence schema must reject unknown top-level fields: {path}')
          replay = json.loads(Path('config/egpu_integrated_guardian_replay_row.schema.json').read_text())
          if replay.get('additionalProperties') is not False:
            raise SystemExit('Guardian replay row schema must reject unknown top-level fields')
          required = set(replay.get('required', []))
          if required != {'sourceHead', 'sourceBranch', 'active', 'shadow', 'scene'}:
            raise SystemExit('Guardian replay row required fields changed unexpectedly')
          scene_props = replay['$defs']['scene']['properties']
          for required_scene_field in ('leadCutOutTimeS', 'leadCutOutConfidence'):
            if required_scene_field not in scene_props:
              raise SystemExit(f'missing Carrot cut-out replay field: {required_scene_field}')
          print('evidenceSchemaTopLevelContract=PASS')
          PY

      - name: Verify parked probe is readiness-gated and has no control publication
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          path = Path('tools/egpu_integrated_s4b_shadow_probe.py')
          source = path.read_text(encoding='utf-8')
          tree = ast.parse(source)
          for node in ast.walk(tree):
            if isinstance(node, ast.ImportFrom):
              for alias in node.names:
                if alias.name == 'PubMaster':
                  raise SystemExit('forbidden PubMaster import')
            if isinstance(node, ast.Call) and isinstance(node.func, ast.Attribute) and node.func.attr == 'send':
              if node.args and isinstance(node.args[0], ast.Constant) and node.args[0].value in {'modelV2', 'carControl'}:
                raise SystemExit(f'forbidden publish call: {node.args[0].value}')
          for required in (
            'controlEligible\", False', 'qualityComparisonEligible\", False', 'MAX_S4B_HZ = 5.0',
            '"--readiness"', '"--expected-head"', 'S4B_REVIEW_READINESS',
            'shadowExecutionAuthorization', 's4bReadinessSha256',
          ):
            if required not in source:
              raise SystemExit(f'missing S4B safety invariant: {required}')
          gate_call = source.index('_, readiness_sha256 = validate_entry(')
          heavy_import = source.index('import numpy as np')
          if gate_call >= heavy_import:
            raise SystemExit('S4B readiness gate must run before heavy camera/QCOM initialization')
          print('s4bReadinessEntryGateVerification=PASS')
          PY

      - name: Diff hygiene
        run: git diff --check
